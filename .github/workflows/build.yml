name: Build Waterfox Lite (Legacy CPU & GPU Optimized)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package Waterfox Lite (x64 Legacy)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Waterfox Base Runtime (Legacy CPU/GPU Branch)
        shell: pwsh
        run: |
          Write-Host "Fetching Waterfox G6.0.20 base binary (optimized for older CPUs)..."
          $url = "https://cdn1.waterfox.net/waterfox/releases/G6.0.20/WINNT_x86_64/Waterfox%20Setup%20G6.0.20.exe"
          Invoke-WebRequest -Uri $url -OutFile "waterfox_installer.exe" -UserAgent "Mozilla/5.0"
          
          if (-not (Test-Path "waterfox_installer.exe") -or (Get-Item "waterfox_installer.exe").Length -lt 10000000) {
            Write-Error "Failed to download complete Waterfox installer."
            exit 1
          }
          Write-Host "Base binary acquired successfully ($((Get-Item 'waterfox_installer.exe').Length) bytes)."

      - name: Extract & Prepare Portable Tree
        shell: pwsh
        run: |
          Write-Host "Extracting package into portable directory..."
          New-Item -ItemType Directory -Path "WaterfoxLite_Dist" -Force
          # Extract with 7-Zip
          7z x waterfox_installer.exe -o"WaterfoxLite_Dist\app" -y
          
          # Remove uninstaller stubs
          Remove-Item -Path "WaterfoxLite_Dist\app\$*" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Apply Waterfox Lite Core Patches & Engine
        shell: pwsh
        run: |
          Write-Host "Applying Waterfox Lite legacy CPU & GPU patches..."
          
          # 1. Create distribution preferences
          $prefDir = "WaterfoxLite_Dist\app\browser\defaults\preferences"
          New-Item -ItemType Directory -Path $prefDir -Force
          Copy-Item -Path "core\prefs\user.js" -Destination "$prefDir\00-waterfox-lite.js" -Force
          
          # 2. Setup distribution policies (Disable telemetry, force H.264, software webrender)
          $policyDir = "WaterfoxLite_Dist\app\distribution"
          New-Item -ItemType Directory -Path $policyDir -Force
          $policyJson = @{
            policies = @{
              DisableTelemetry = $true
              DisableFirefoxStudies = $true
              DisablePocket = $true
              OverrideFirstRunPage = ""
              OverridePostUpdatePage = ""
              Homepage = @{
                URL = "about:home"
                Locked = $false
                StartPage = "homepage"
              }
              Preferences = @{
                "gfx.webrender.all" = $false
                "gfx.webrender.software" = $true
                "gfx.canvas.accelerated" = $false
                "layers.acceleration.disabled" = $true
                "media.mediasource.vp9.enabled" = $false
                "media.av1.enabled" = $false
                "media.wmf.vp9.enabled" = $false
                "dom.webcodecs.enabled" = $false
                "webgl.out-of-process" = $false
                "layers.gpu-process.enabled" = $false
                "dom.ipc.processHangMonitor" = $true
                "dom.ipc.processHangTimeoutSecs" = 15
                "javascript.options.parallel_parsing" = $false
                "javascript.options.mem.gc_incremental" = $true
                "network.http.max-connections" = 128
                "network.dns.disableIPv6" = $true
                "dom.ipc.processCount" = 2
                "browser.tabs.unloadOnLowMemory" = $true
                "browser.low_commit_space_threshold_mb" = 1024
                "toolkit.legacyUserProfileCustomizations.stylesheets" = $true
                "browser.startup.homepage" = "about:home"
                "browser.newtab.url" = "about:home"
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "$policyDir\policies.json" -Value $policyJson -Encoding UTF8

          # 3. Create default portable profile with user.js and chrome CSS
          $profileDir = "WaterfoxLite_Dist\profile"
          $chromeDir = "$profileDir\chrome"
          New-Item -ItemType Directory -Path $chromeDir -Force
          Copy-Item -Path "core\prefs\user.js" -Destination "$profileDir\user.js" -Force
          Copy-Item -Path "core\chrome\*" -Destination $chromeDir -Force -Recurse
          Copy-Item -Path "core\pages\*" -Destination $profileDir -Force -Recurse

          # 4. Inject xapp and ytm debloat scripts
          $modulesDir = "WaterfoxLite_Dist\modules"
          New-Item -ItemType Directory -Path $modulesDir -Force
          Copy-Item -Path "core\modules\*" -Destination $modulesDir -Force

          # 5. Compile and embed Native C Theme Shell & Icon Cache
          Write-Host "Compiling Waterfox Lite Native UI Shell (C / Win32) with embedded resources..."
          python scripts/generate_icon_cache.py
          windres native_ui/resources.rc -O coff -o native_ui/resources.o
          gcc -O3 -s native_ui/waterfox_lite_ui.c native_ui/resources.o -o "WaterfoxLite_Dist\WaterfoxLite_NativeUI.exe" -mwindows -lgdi32 -luser32 -lcomctl32 -lpsapi -lshell32 -ldwmapi -lshlwapi
          Copy-Item "WaterfoxLite_Dist\WaterfoxLite_NativeUI.exe" "WaterfoxLite_Dist\WaterfoxLite.exe" -Force
          $cacheDist = "WaterfoxLite_Dist\cache"
          New-Item -ItemType Directory -Path $cacheDist -Force
          Copy-Item -Path "native_ui\cache\*" -Destination $cacheDist -Force

          # 6. Add one-click portable launchers
          $launcherLines = @(
            '@echo off',
            'title Waterfox Lite (Portable)',
            'cd /d "%~dp0"',
            'if exist "WaterfoxLite.exe" (',
            '    start "" "WaterfoxLite.exe" %*',
            ') else if exist "WaterfoxLite_NativeUI.exe" (',
            '    start "" "WaterfoxLite_NativeUI.exe" %*',
            ') else (',
            '    start "" "app\waterfox.exe" -profile "profile" %*',
            ')',
            'exit'
          )
          Set-Content -Path "WaterfoxLite_Dist\WaterfoxLite.bat" -Value $launcherLines -Encoding ASCII

          $coreLauncherLines = @(
            '@echo off',
            'title Waterfox Lite (Direct Engine)',
            'cd /d "%~dp0"',
            'start "" "app\waterfox.exe" -profile "profile" -no-remote %*',
            'exit'
          )
          Set-Content -Path "WaterfoxLite_Dist\WaterfoxLite_DirectGecko.bat" -Value $coreLauncherLines -Encoding ASCII

          Write-Host "All patches, native C shell, modules, and launchers injected successfully."

      - name: Package Waterfox Lite Distribution
        shell: pwsh
        run: |
          Write-Host "Creating Waterfox-Lite-x64-Legacy.zip..."
          7z a -tzip "Waterfox-Lite-x64-Legacy.zip" ".\WaterfoxLite_Dist\*" -mx=9
          
          $hash = (Get-FileHash "Waterfox-Lite-x64-Legacy.zip" -Algorithm SHA256).Hash
          Set-Content -Path "Waterfox-Lite-x64-Legacy.zip.sha256" -Value "$hash *Waterfox-Lite-x64-Legacy.zip"
          Write-Host "SHA256: $hash"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Waterfox-Lite-x64-Legacy
          path: |
            Waterfox-Lite-x64-Legacy.zip
            Waterfox-Lite-x64-Legacy.zip.sha256
          retention-days: 30
